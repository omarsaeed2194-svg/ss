<!--
  Saudisoft homepage — 02 CLIENT LOGOS
  HOW TO USE (WPBakery):
   1. Add a Row. Row settings > Type: "Full Width Content", Padding top/bottom: 0.
   2. Inside the (single, 1/1) column add a "Raw HTML" element and paste this whole file.
   3. The "00-global-styles.html" block must be on the same page ONCE, above all sections.
-->

<style>
.ss.ss .logos{padding:34px 0;border-bottom:1px solid var(--line);background:#fff}
.ss.ss .logos .wrap{display:flex;align-items:center;gap:40px}
.ss.ss .logos p{flex:0 0 auto;font-weight:700;color:var(--muted);font-size:17px;max-width:180px;line-height:1.2}
.ss.ss .marquee{overflow:hidden;flex:1;min-width:0;width:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ss.ss .track{display:flex;gap:64px;width:max-content;animation:ss-scroll 30s linear infinite}
.ss.ss .marquee:hover .track{animation-play-state:paused}
.ss.ss .track img{height:64px;width:auto;filter:grayscale(1);opacity:.7;transition:.3s}
.ss.ss .track img:hover{filter:none;opacity:1}
@media (max-width:680px){
.ss.ss .logos .wrap{flex-direction:column;align-items:flex-start;gap:16px}
}
</style>
<div class="ss">
<div class="logos">
  <div class="wrap">
    <p>Trusted by global brands in every industry</p>
    <div class="marquee">
      <div class="track" id="logoTrack">
        <img src="https://localization.saudisoft.com/wp-content/uploads/2024/11/Tes1.png.png" alt="Client logo" width="150" height="150" loading="lazy">
        <img src="https://localization.saudisoft.com/wp-content/uploads/2024/11/pos-150x150.png.png" alt="Posiflex" width="150" height="150" loading="lazy">
        <img src="https://localization.saudisoft.com/wp-content/uploads/2024/11/uni-150x150.png.png" alt="Client logo" width="150" height="150" loading="lazy">
        <img src="https://localization.saudisoft.com/wp-content/uploads/2024/11/Tes5.png.png" alt="Client logo" width="150" height="150" loading="lazy">
        <img src="https://localization.saudisoft.com/wp-content/uploads/2024/11/Tes3.png.png" alt="Client logo" width="150" height="150" loading="lazy">
        <img src="https://localization.saudisoft.com/wp-content/uploads/2024/11/Tes2.png.png" alt="SAP" width="150" height="150" loading="lazy">
      </div>
    </div>
  </div>
</div>
</div>
<script>
(function(){
function run(){
var t = document.querySelector('.ss #logoTrack'); if (!t || t.dataset.init) return; t.dataset.init = 1; t.innerHTML += t.innerHTML;
}
if(document.readyState!=="loading")run();else document.addEventListener("DOMContentLoaded",run);
})();
</script>
