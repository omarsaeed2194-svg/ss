<!--
  Saudisoft homepage — 07 STATS / NUMBERS
  HOW TO USE (WPBakery):
   1. Add a Row. Row settings > Type: "Full Width Content", Padding top/bottom: 0.
   2. Inside the (single, 1/1) column add a "Raw HTML" element and paste this whole file.
   3. The "00-global-styles.html" block must be on the same page ONCE, above all sections.
-->

<style>
.ss.ss .stats{background:var(--dark);color:#fff;position:relative;overflow:hidden}
.ss.ss .stats::before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(12,108,66,.5),transparent 70%);right:-200px;top:-250px}
.ss.ss .stats .wrap{position:relative;display:grid;grid-template-columns:1fr 1.4fr;gap:60px;align-items:center}
.ss.ss .stats .eyebrow{color:var(--yellow)}
.ss.ss .stats h2{margin:12px 0 16px;color:#fff}
.ss.ss .stats p{color:#aebdb5}
.ss.ss .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ss.ss .stat{border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:28px;background:rgba(255,255,255,.03)}
.ss.ss .stat strong{font-size:clamp(48px,5vw,68px);line-height:1;color:var(--yellow);font-weight:800}
.ss.ss .stat span{display:block;margin-top:8px;color:#cfdcd5;font-size:18px}
@media (max-width:1100px){
.ss.ss .stats .wrap{grid-template-columns:1fr}
}
@media (max-width:680px){
.ss.ss .stat-grid{grid-template-columns:1fr}
}
</style>
<div class="ss">
<section class="stats">
  <div class="wrap">
    <div class="reveal">
      <span class="eyebrow">Our business in numbers</span>
      <h2>Speed, scale and precision — proven over four decades</h2>
      <p>Clients come back because quality isn't an act for us, it's a habit.</p>
    </div>
    <div class="stat-grid">
      <div class="stat reveal"><strong data-count="100" data-suffix="+">100+</strong><span>Languages supported</span></div>
      <div class="stat reveal"><strong data-count="90" data-suffix="%">90%</strong><span>Customer retention</span></div>
      <div class="stat reveal"><strong data-count="70" data-suffix="+">70+</strong><span>Countries served</span></div>
      <div class="stat reveal"><strong data-count="40" data-suffix="+">40+</strong><span>Years in localization</span></div>
    </div>
  </div>
</section>
</div>
