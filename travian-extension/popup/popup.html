<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Travian Helper</title>
  <link rel="stylesheet" href="../src/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Travian Helper</h1>
      <span id="server" class="muted small"></span>
    </div>
    <span id="gold" class="muted small"></span>
  </header>

  <section class="toggles">
    <label class="switch"><input type="checkbox" id="watch"> <span>Watch &amp; alert</span></label>
    <label class="switch"><input type="checkbox" id="bot"> <span>Automate actions</span></label>
  </section>

  <div id="status" class="status"></div>
  <main id="villages"></main>

  <footer class="bottom">
    <button class="btn" id="checkNow">Check now</button>
    <button class="btn" id="openGame">Open Travian</button>
    <button class="btn primary" id="openDashboard">Dashboard</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
