<meta charset="utf-8">
<title>Clout Chaser</title>
<meta name="description" content="A social media life sim: grow from zero to icon across five platforms, deal with celebrities, brands, scandals and burnout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&display=swap">
<style>
/* Layout: a social app. Desktop = icon sidebar | 600px timeline column | trends rail. Phone = app bar, timeline, bottom tab bar, floating compose button. */
:root {
  --bg: #000000;
  --surface: #16181C;
  --surface-2: #202327;
  --hover: rgba(231, 233, 234, .04);
  --ink: #E7E9EA;
  --muted: #71767B;
  --line: #2F3336;
  --accent: #1D9BF0;
  --accent-soft: rgba(29, 155, 240, .14);
  --like: #F91880;
  --repost: #00BA7C;
  --gold: #FFD400;
  --good: #00BA7C;
  --bad: #F4212E;
  --warn: #FFAD1F;
  --btn: #EFF3F4;
  --btn-ink: #0F1419;
  --scrim: rgba(91, 112, 131, .4);
  --f-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-display: 'Unbounded', 'Arial Black', var(--f-body);
  --f-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FFFFFF; --surface: #F7F9F9; --surface-2: #EFF3F4; --hover: rgba(15, 20, 25, .03); --ink: #0F1419; --muted: #536471; --line: #E1E8ED;
    --accent-soft: rgba(29, 155, 240, .1); --gold: #D4A600; --btn: #0F1419; --btn-ink: #FFFFFF; --scrim: rgba(0, 0, 0, .4);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --surface: #F7F9F9; --surface-2: #EFF3F4; --hover: rgba(15, 20, 25, .03); --ink: #0F1419; --muted: #536471; --line: #E1E8ED;
  --accent-soft: rgba(29, 155, 240, .1); --gold: #D4A600; --btn: #0F1419; --btn-ink: #FFFFFF; --scrim: rgba(0, 0, 0, .4);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35; margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; text-wrap: balance; }
p { margin: 0; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .gold { color: var(--gold); } .blue { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; }
.ico-lg { width: 26px; height: 26px; }

/* ---------- App frame ---------- */
.layout { display: grid; grid-template-columns: 260px 600px 350px; justify-content: center; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; overflow-y: auto; scrollbar-width: none; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; padding: 10px 12px 12px; }
.brand em { font-style: normal; color: var(--like); }
.nav-item { display: flex; align-items: center; gap: 16px; padding: 11px 12px; border-radius: 99px; border: 0; background: none; font-size: 19px; text-align: left; width: fit-content; position: relative; }
.nav-item:hover { background: var(--hover); }
.nav-item[aria-current="page"] { font-weight: 800; }
.nav-item .dotbadge { position: absolute; top: 6px; left: 26px; min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.nav-sub { font-size: 15px; padding: 8px 12px; color: var(--muted); gap: 14px; }
.nav-sub[aria-current="page"] { color: var(--ink); }
.nav-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.post-btn { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 99px; font-weight: 800; font-size: 17px; padding: 14px; margin: 12px 0 8px; width: 100%; }
.me-chip { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 99px; border: 0; background: none; text-align: left; }
.me-chip:hover { background: var(--hover); }

.col { border-inline: 1px solid var(--line); min-width: 0; min-height: 100vh; padding-bottom: 80px; }
.col-head { position: sticky; top: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.col-title { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 53px; }
.col-title h2 { font-size: 20px; }
.col-title .sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--hover); }
.tabs { display: flex; }
.tabs button { flex: 1; background: none; border: 0; padding: 15px 8px 0; color: var(--muted); font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tabs button:hover { background: var(--hover); }
.tabs button span.bar { height: 4px; width: 56px; border-radius: 99px; background: transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-selected="true"] span.bar { background: var(--accent); }

.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 8px 0 24px 28px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.rail > * { flex: none; }
.rail .statgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panel { background: var(--surface); border-radius: 16px; overflow: hidden; }
.panel.bordered { background: none; border: 1px solid var(--line); }
.panel h3 { font-size: 20px; padding: 12px 16px; }
.panel-row { display: block; width: 100%; text-align: left; padding: 12px 16px; background: none; border: 0; }
.panel-row:hover { background: var(--hover); }
.panel-foot { padding: 14px 16px; color: var(--accent); font-size: 15px; background: none; border: 0; text-align: left; width: 100%; }
.panel-foot:hover { background: var(--hover); }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 99px; padding: 10px 16px; color: var(--muted); border: 1px solid transparent; }
.search:focus-within { border-color: var(--accent); background: var(--bg); color: var(--accent); }
.search input { border: 0; background: none; outline: none; flex: 1; color: var(--ink); min-width: 0; }

.topbar { display: none; }
.tabbar { display: none; }
.fab { display: none; }

/* ---------- Status meters (Aura-style stats) ---------- */
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.statcell { background: var(--surface); padding: 10px 14px; min-width: 0; }
.statcell .k { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.statcell .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .6s ease; }
.meter.good > i { background: var(--good); } .meter.bad > i { background: var(--bad); } .meter.warn > i { background: var(--warn); } .meter.gold > i { background: var(--gold); } .meter.like > i { background: var(--like); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.strip .sp { flex: none; display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; border: 0; }
.strip .sp .l { color: var(--muted); font-weight: 500; }

/* ---------- Timeline posts ---------- */
.tw { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.tw:hover { background: var(--hover); }
.tw.fresh { animation: slidein 1.2s ease; }
.tw-ctx { grid-column: 2; font-size: 13px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: -6px; }
.tw-ctx.gold { color: var(--gold); }
.tw-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tw-head { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 15px; }
.tw-head b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.tw-head .h { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tw-head .pl { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.tw-text { font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.tw-text .tag, .tw-text .at { color: var(--accent); }
.tw-media { margin-top: 8px; border-radius: 16px; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-width: 100%; max-height: 260px; display: grid; place-items: center; position: relative; overflow: hidden; color: #fff; }
.tw-media .lbl { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-align: center; padding: 16px; text-shadow: 0 2px 12px rgba(0,0,0,.3); line-height: 1.15; }
.tw-media .play { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.tw-media .dur { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.6); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-weight: 700; }
.tw-actions { display: flex; justify-content: space-between; max-width: 425px; margin-top: 8px; margin-left: -8px; }
.act { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0; font-variant-numeric: tabular-nums; }
.act .ib { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
.act .ico { width: 18px; height: 18px; }
.act:hover { color: var(--accent); } .act:hover .ib { background: var(--accent-soft); }
.act.rp:hover, .act.rp.on { color: var(--repost); } .act.rp:hover .ib { background: rgba(0, 186, 124, .12); }
.act.lk:hover, .act.lk.on { color: var(--like); } .act.lk:hover .ib { background: rgba(249, 24, 128, .12); }
.act.on .ico { fill: currentColor; }
.act[disabled] { opacity: .5; cursor: default; }
.pop { animation: pop .35s ease; }
.badge-v { display: inline-grid; place-items: center; width: 17px; height: 17px; flex: none; color: var(--accent); }
.badge-v.gold { color: var(--gold); }
.badge-v svg { width: 17px; height: 17px; }

.av { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; flex: none; letter-spacing: 0; }
.av.sm { width: 32px; height: 32px; font-size: 12px; }
.av.xs { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 48px; height: 48px; font-size: 16px; }
.av.xl { width: 134px; height: 134px; font-size: 42px; border: 4px solid var(--bg); }

/* thread */
.thread-main { padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
.thread-main .tw-text { font-size: 17px; margin-top: 12px; }
.thread-meta { color: var(--muted); font-size: 15px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.thread-counts { display: flex; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.thread-counts b { color: var(--ink); }
.reply-box { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.reply-box textarea { width: 100%; border: 0; background: none; resize: none; font-size: 17px; padding: 8px 0; outline: none; min-height: 44px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

/* ---------- Buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 99px; border: 1px solid var(--line); background: none; padding: 0 16px; min-height: 34px; font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { filter: brightness(.92); background: var(--btn); }
.btn.blue { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.big { min-height: 44px; font-size: 16px; padding: 0 24px; }
.btn.sm { min-height: 30px; font-size: 13px; padding: 0 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip[disabled] { opacity: .4; cursor: not-allowed; }
.chip .cost { font-size: 12px; opacity: .7; font-weight: 500; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
/* horizontal rows: fade the edge that has more content, scroll with the mouse wheel or by dragging */
.scroller.more-r, .strip.more-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.scroller.more-l, .strip.more-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px); mask-image: linear-gradient(90deg, transparent, #000 36px); }
.scroller.more-l.more-r, .strip.more-l.more-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
@media (pointer: fine) { .scroller.more-l, .scroller.more-r, .strip.more-l, .strip.more-r { cursor: grab; } .dragging, .dragging * { cursor: grabbing !important; user-select: none; } }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.gold { color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, transparent); }
.pill.blue { color: var(--accent); background: var(--accent-soft); }
.pill.like { color: var(--like); background: color-mix(in srgb, var(--like) 14%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.input { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 12px; width: 100%; outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.label { font-size: 13px; color: var(--muted); }

/* ---------- Generic sections (career screens) ---------- */
.sect { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.sect h3 { font-size: 17px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.owned { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.card .t { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.empty { padding: 40px 32px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 24px; }
.list-row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-inline: 0; border-top: 0; width: 100%; text-align: left; }
.list-row:hover { background: var(--hover); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
table.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
.lb td, .lb th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.lb th { color: var(--muted); font-weight: 500; font-size: 13px; }
.lb td.n { text-align: right; font-variant-numeric: tabular-nums; }
.lb tr.you td { background: var(--accent-soft); font-weight: 700; }
.table-wrap { overflow-x: auto; }

/* ---------- Notifications ---------- */
.nt { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.nt:hover { background: var(--hover); }
.nt.unread { background: var(--accent-soft); }
.nt .ni { display: flex; justify-content: flex-end; padding-top: 2px; }
.nt .ni .ico { width: 28px; height: 28px; }
.nt .quote { color: var(--muted); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }

/* ---------- Messages ---------- */
.chat { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-height: 50vh; }
.bub { max-width: 78%; padding: 10px 14px; border-radius: 22px; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.bub.them { background: var(--surface-2); align-self: flex-start; border-bottom-left-radius: 6px; }
.bub.me { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.bub-meta { font-size: 12px; color: var(--muted); margin: 2px 6px 10px; }
.bub-meta.me { align-self: flex-end; }
.bub-acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
.offer { border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 86%; align-self: flex-start; background: var(--bg); }
.dm-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.dm-bar input { flex: 1; background: var(--surface-2); border: 0; border-radius: 99px; padding: 10px 16px; outline: none; min-width: 0; }
.typing { align-self: flex-start; background: var(--surface-2); border-radius: 22px; padding: 12px 16px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

/* ---------- Profile ---------- */
.banner { height: 200px; max-width: 100%; }
.prof { padding: 12px 16px 0; position: relative; }
.prof .av.xl { margin-top: -80px; }
.prof-actions { position: absolute; right: 16px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.prof h2 { font-size: 20px; display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.prof .handle { color: var(--muted); }
.prof .bio { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.prof .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-top: 12px; }
.prof .counts { display: flex; gap: 20px; margin: 12px 0; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.prof .counts b { color: var(--ink); }
.relbar { height: 6px; background: var(--surface-2); border-radius: 99px; position: relative; overflow: hidden; }
.relbar i { position: absolute; top: 0; bottom: 0; }
.relbar::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--bg); }

/* ---------- Trends ---------- */
.trend-row { display: flex; justify-content: space-between; gap: 8px; }
.trend-row .ctx { font-size: 13px; color: var(--muted); }
.trend-row b { display: block; font-size: 15px; margin: 2px 0; }
.trend-row .pill { align-self: flex-start; flex: none; }

/* ---------- Compose sheet ---------- */
.sheet-wrap, .modal-wrap, .drawer-wrap { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 5vh 16px; overflow-y: auto; }
.sheet { background: var(--bg); border-radius: 16px; width: min(600px, 100%); display: flex; flex-direction: column; animation: rise .22s ease; }
@media (min-width: 701px) { .sheet { max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; position: sticky; top: 0; background: var(--bg); border-radius: 16px 16px 0 0; z-index: 2; }
.compose-body { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 4px 16px 12px; }
.compose-body textarea { border: 0; background: none; resize: none; font-size: 20px; outline: none; width: 100%; min-height: 120px; padding: 8px 0; line-height: 1.35; }
.aud { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); color: var(--accent); border-radius: 99px; padding: 2px 12px; font-size: 14px; font-weight: 700; background: none; }
.opts { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.opt-lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.forecast { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.forecast b { color: var(--ink); font-variant-numeric: tabular-nums; }
.compose-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 14px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--bg); border-radius: 0 0 16px 16px; }
.ring { width: 26px; height: 26px; }
.energy-pill { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; font-weight: 700; }

/* ---------- Event modal ---------- */
.modal { background: var(--bg); border-radius: 16px; width: min(520px, 100%); padding: 24px; display: flex; flex-direction: column; gap: 14px; animation: rise .22s ease; margin: auto 0; }
.modal .eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.modal h3 { font-size: 23px; line-height: 1.2; }
.modal .body { font-size: 15px; color: var(--ink); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: none; border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.choice:hover { background: var(--hover); border-color: var(--muted); }
.choice b { font-weight: 700; }
.choice span { font-size: 13px; color: var(--muted); }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.fx { display: flex; gap: 6px; flex-wrap: wrap; }
.fx .pill { font-size: 13px; padding: 4px 10px; }
.summary-lines { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.summary-lines div { display: flex; justify-content: space-between; gap: 10px; }
.summary-lines .num { white-space: nowrap; font-weight: 700; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
#modalOk { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 99px; min-height: 44px; font-weight: 800; padding: 0 24px; }

/* ---------- Drawer ---------- */
.drawer-wrap { padding: 0; justify-content: flex-start; align-items: stretch; }
.drawer { background: var(--bg); width: min(300px, 85vw); min-height: 100%; overflow-y: auto; padding: 16px 12px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 2px; animation: slideright .2s ease; }

/* ---------- Floating stat deltas (Status-style feedback) ---------- */
.deltas { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 116px); left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.delta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 8px; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: floatin 2.6s ease forwards; max-width: calc(100vw - 32px); }
.delta .pill { font-size: 13px; padding: 3px 9px; }
.delta.energy { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); align-items: center; padding: 6px 12px 6px 6px; animation-duration: 3.1s; }
.delta.energy .why { font-size: 13px; font-weight: 600; }
.delta .pill .ico, .strip .sp .ico { width: 14px; height: 14px; }
.energy-val { display: inline-block; }
.energy-val.charged { animation: charge .7s ease; }
@keyframes charge { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--gold); } 100% { transform: scale(1); } }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--accent); color: #fff; padding: 12px 18px; border-radius: 8px; font-weight: 600; font-size: 15px; max-width: min(420px, calc(100vw - 32px)); animation: rise .2s ease; text-align: center; }
.toast.gold { background: var(--gold); color: #1a1400; }
.toast.bad { background: var(--bad); }

/* ---------- Onboarding ---------- */
.onb { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
.onb-card { width: min(560px, 100%); display: flex; flex-direction: column; gap: 22px; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 11vw, 72px); line-height: .9; letter-spacing: -.03em; }
.logo em { font-style: normal; color: var(--like); }
.steps { display: flex; gap: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 99px; background: var(--surface-2); }
.steps i.on { background: var(--accent); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pick { text-align: left; border: 1px solid var(--line); background: none; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.pick:hover { background: var(--hover); }
.pick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.pick b { font-size: 16px; }
.pick span { font-size: 13px; color: var(--muted); }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--bg) inset; }
.preview-card { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

/* ---------- Charts ---------- */
.chart-box { position: relative; width: 100%; height: 240px; }
.chart-box canvas { width: 100%; height: 100%; display: block; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 14px; }
.bar-row .track { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: inherit; }
.bar-row .n { text-align: right; font-variant-numeric: tabular-nums; }
.ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.rung { background: var(--surface); border-radius: 10px; padding: 8px; font-size: 12px; min-width: 0; }
.rung b { display: block; font-size: 13px; }
.rung.on { background: var(--accent); color: #fff; }
.rung.on .muted { color: inherit; opacity: .8; }
.ach { display: flex; gap: 10px; align-items: flex-start; }
.medal { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; font-weight: 800; }
.ach.on .medal { background: color-mix(in srgb, var(--gold) 20%, transparent); color: var(--gold); }
.ach.off { opacity: .55; }
.news { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.news .nh { font-weight: 700; font-size: 16px; line-height: 1.3; }
.news.you .nh { color: var(--accent); }

.clash { margin: 12px 16px; border: 1px solid color-mix(in srgb, var(--like) 35%, var(--line)); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--like) 5%, var(--bg)); }
.clash.done { opacity: .75; }
.clash-vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }
.cv { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; text-align: center; min-width: 0; padding: 4px; border-radius: 12px; }
.cv:hover { background: var(--hover); }
.cv b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.vs { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--like); }
.clash-bar, .bmeter { height: 10px; border-radius: 99px; background: var(--accent); overflow: hidden; }
.clash-bar i, .bmeter i { display: block; height: 100%; background: var(--like); border-radius: 99px 0 0 99px; transition: width .6s ease; }
.challenge { margin: 12px 16px; display: flex; gap: 12px; align-items: center; border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); border-radius: 16px; padding: 12px 14px; color: var(--ink); }
.challenge > .ico-lg { color: var(--gold); }
.challenge.done { opacity: .7; }
.challenge.food { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.challenge.food > .ico-lg { color: var(--warn); }
.challenge .pill { vertical-align: 1px; }
.battle { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.bside { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
.swatch-mini { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.av { overflow: hidden; }
.av svg { width: 100%; height: 100%; display: block; }
.av.co { border-radius: 10px; background: none; }
.flag { font-size: 14px; line-height: 1; }
.tw-media .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tw-media .play, .tw-media .dur { z-index: 1; }
.subreply { display: flex; gap: 8px; margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line); font-size: 14px; }
.thumb { position: relative; width: 160px; max-width: 100%; margin-bottom: 8px; }
.thumb img { width: 100%; border-radius: 12px; display: block; }
.thumb .icon-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,.6); color: #fff; }
.mention-box { position: fixed; z-index: 80; width: 320px; max-width: calc(100vw - 16px); max-height: 390px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.4); padding: 5px; }
.mention-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.mention-item:hover, .mention-item.on { background: var(--surface-2); }
.mention-panel { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; }
.mp-row { display: flex; gap: 10px; align-items: flex-start; }
.chip.beefchip[aria-pressed="true"] { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border-color: var(--bad); }
.persona { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; padding: 10px 12px; background: var(--surface); border-radius: 12px; }
.poll { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.poll-row { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px; border-radius: 8px; overflow: hidden; font-size: 14px; border: 1px solid var(--line); }
.poll-row i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--surface-2); z-index: 0; }
.poll-row.win i { background: var(--accent-soft); }
.poll-row span, .poll-row b { position: relative; z-index: 1; }
.poll-edit { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.poll-edit .input { padding: 8px 12px; }
.chip.allchip[aria-pressed="true"] { background: color-mix(in srgb, var(--repost) 16%, transparent); color: var(--repost); border-color: var(--repost); }
.spin-card { margin: 12px 16px 0; display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.wheel { width: 44px; height: 44px; border-radius: 50%; position: relative; flex: none; background: conic-gradient(var(--like) 0 45deg, var(--accent) 45deg 90deg, var(--gold) 90deg 135deg, var(--repost) 135deg 180deg, var(--like) 180deg 225deg, var(--accent) 225deg 270deg, var(--gold) 270deg 315deg, var(--repost) 315deg 360deg); display: grid; place-items: center; }
.wheel b { width: 18px; height: 18px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; color: var(--gold); }
.wheel b .ico { width: 12px; height: 12px; }
.wheel.spinning { animation: wheelspin 1.3s cubic-bezier(.2,.8,.3,1); }
@keyframes wheelspin { to { transform: rotate(1440deg); } }
.topfans { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.card .t .pill { flex: none; align-self: flex-start; }
.gifts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.gift { display: inline-flex; align-items: center; gap: 3px; background: var(--surface-2); border-radius: 99px; padding: 4px 10px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.gift b { font-size: 16px; }
.tip { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); background: color-mix(in srgb, var(--gold) 7%, var(--bg)); }
.ms-list { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 8px; }
.ms { display: flex; flex-direction: column; gap: 3px; }
.ms-n { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms .meter { margin-top: 2px; }
/* ---------- Arena: sportsbook, casino, pass ---------- */
.world { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); }
.world-banner { display: block; width: calc(100% - 32px); margin: 10px 16px 0; text-align: left; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); border-radius: 14px; padding: 9px 12px; font-size: 13px; }
.world-banner span { color: var(--muted); }
.match { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.match.done { opacity: .7; }
.teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: center; }
.teams b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.odds { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.odd { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.odd span { font-size: 11px; color: var(--muted); } .odd b { font-variant-numeric: tabular-nums; }
.odd.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.betslip { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px; background: var(--surface); }
.mybets { display: flex; flex-wrap: wrap; gap: 6px; }
.livebox { border: 1px solid color-mix(in srgb, var(--like) 45%, var(--line)); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--like) 5%, var(--bg)); }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: center; font-weight: 700; }
.score b { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.minbar { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-2); margin-left: 10px; overflow: hidden; } .minbar i { display: block; height: 100%; background: var(--like); }
.feedlines { display: flex; flex-direction: column; gap: 3px; min-height: 60px; }
.lgt { display: flex; flex-direction: column; gap: 4px; }
.reels { display: flex; gap: 10px; justify-content: center; }
.reels span { width: 72px; height: 72px; border-radius: 16px; background: var(--surface-2); display: grid; place-items: center; font-size: 38px; }
.rball { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; }
.rball.red { background: #D7263D; } .rball.black { background: #222; border: 1px solid var(--line); } .rball.green { background: #00A86B; }
.crash { border-radius: 14px; background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.crash .cm { font-family: var(--f-display); font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
.crash.crashed { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.pass-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.pass-tier { font-size: 14px; } .pass-tier b { font-family: var(--f-display); font-size: 24px; }
.pass-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ptier { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; position: relative; opacity: .6; }
.ptier.open { opacity: 1; border-color: var(--gold); } .ptier.got { opacity: 1; border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.ptier.big { background: color-mix(in srgb, var(--gold) 8%, var(--bg)); }
.pt-n { font-size: 11px; color: var(--muted); font-weight: 700; } .pt-i { font-size: 22px; } .pt-t { font-size: 12px; font-weight: 600; }
.qt.arenaq { color: var(--gold); }
@media (max-width: 700px) { .odds { gap: 4px; } .reels span { width: 60px; height: 60px; font-size: 32px; } .pass-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* ---------- Visuals: animated scenes, stories, event art, bursts ---------- */
.scene .v-anim { animation-play-state: paused; }
.tw-media.inview .scene .v-anim, .story-media .scene .v-anim { animation-play-state: running; }
.v-steam { animation: steam 2.4s ease-in-out infinite; }
.v-pulse { animation: vpulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.v-drift { animation: drift 9s linear infinite alternate; }
.v-fly { animation: fly 6s linear infinite; }
.v-eq { animation: eqb 1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
.v-twinkle { animation: twinkle 1.8s ease-in-out infinite; }
.v-spot { animation: spot 4s ease-in-out infinite alternate; transform-box: view-box; transform-origin: 50% 0; }
.v-spin { animation: vspin 3s linear infinite; }
.v-rise { animation: rise2 3s ease-in infinite; }
.v-bob { animation: bob 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.v-fg.v-anim { animation: fgbeat 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 50% 55%; }
@keyframes steam { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .6; } 100% { opacity: 0; transform: translateY(-25px); } }
@keyframes vpulse { 50% { transform: scale(1.35); opacity: 1; } }
@keyframes drift { to { transform: translateX(60px); } }
@keyframes fly { from { transform: translate(-60px, 20px); } to { transform: translate(420px, -40px); } }
@keyframes eqb { from { transform: scaleY(.5); } to { transform: scaleY(1.1); } }
@keyframes twinkle { 50% { opacity: .2; } }
@keyframes spot { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
@keyframes vspin { to { transform: rotate(360deg); } }
@keyframes rise2 { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-170px); opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
@keyframes fgbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04) rotate(.6deg); } }
.tw-media .eq { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 2px; align-items: flex-end; height: 14px; opacity: 0; transition: opacity .3s; z-index: 1; }
.tw-media .eq i { width: 3px; background: #fff; border-radius: 1px; height: 4px; }
.tw-media.inview .eq { opacity: .9; } .tw-media.inview .eq i { animation: eqi .5s ease-in-out infinite alternate; }
.tw-media .eq i:nth-child(2) { animation-delay: .15s !important; } .tw-media .eq i:nth-child(3) { animation-delay: .3s !important; } .tw-media .eq i:nth-child(4) { animation-delay: .45s !important; }
@keyframes eqi { to { height: 14px; } }
.tw-media .vprog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.25); z-index: 1; }
.tw-media .vprog i { display: block; height: 100%; width: 0; background: #fff; }
.tw-media.inview .vprog i { animation: prog 8s linear infinite; }
@keyframes prog { to { width: 100%; } }
.tw-media.inview .play { opacity: 0; transition: opacity .4s; }
.stories { display: flex; gap: 12px; padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
.story-chip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; font-size: 12px; width: 64px; }
.story-chip > span:last-child { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sring { padding: 2.5px; border-radius: 50%; background: conic-gradient(#FFD400, #F91880, #7B2CF5, #1D9BF0, #FFD400); display: grid; }
.sring .av { border: 2.5px solid var(--bg); width: 54px; height: 54px; }
.sring.seen { background: var(--line); }
.story-view { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.92); display: grid; place-items: center; animation: rise .2s ease; }
.story-card { position: relative; width: min(400px, 100vw); height: min(711px, 100dvh); background: #000; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.story-bars { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 4px; z-index: 3; }
.story-bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); overflow: hidden; }
.story-bars i b { display: block; height: 100%; width: 0; background: #fff; }
