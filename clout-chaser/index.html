<meta charset="utf-8">
<title>Clout Chaser</title>
<meta name="description" content="A social media life sim: grow from zero to icon across five platforms, deal with celebrities, brands, scandals and burnout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: control-room HUD strip across the top, nav rail / main stage / "today" rail below; collapses to one column on phones. */
:root {
  --bg: #F6F2F5;
  --surface: #FFFFFF;
  --surface-2: #EFE8ED;
  --ink: #1D1420;
  --muted: #6E6173;
  --line: #E2D7DF;
  --accent: #D9235B;
  --accent-soft: #FBE1EA;
  --on-accent: #FFFFFF;
  --gold: #C98A00;
  --gold-soft: #FFF2CC;
  --good: #16895C;
  --bad: #CF3D26;
  --warn: #C27A00;
  --info: #2A67C9;
  --shadow: 0 1px 2px rgba(40, 10, 30, .06), 0 8px 24px rgba(40, 10, 30, .06);
  --f-display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #130E16; --surface: #1C1520; --surface-2: #271E2C; --ink: #F5EEF4; --muted: #A597AA; --line: #362B3C;
    --accent: #FF4F86; --accent-soft: #3D1627; --on-accent: #1A0710; --gold: #FFC53D; --gold-soft: #3A2C06;
    --good: #3CCB8F; --bad: #FF6B4F; --warn: #FFB23D; --info: #6EA2FF; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #130E16; --surface: #1C1520; --surface-2: #271E2C; --ink: #F5EEF4; --muted: #A597AA; --line: #362B3C;
  --accent: #FF4F86; --accent-soft: #3D1627; --on-accent: #1A0710; --gold: #FFC53D; --gold-soft: #3A2C06;
  --good: #3CCB8F; --bad: #FF6B4F; --warn: #FFB23D; --info: #6EA2FF; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; }
h4 { font-size: .85rem; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.label { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .gold { color: var(--gold); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- HUD ---------- */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 10px 16px; }
.me { display: flex; gap: 10px; align-items: center; min-width: 0; }
.me-name { font-family: var(--f-display); font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.me-sub { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 14px; min-width: 0; }
.stat { min-width: 0; }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.stat .d { font-family: var(--f-mono); font-size: .7rem; }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 5px; }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s ease; }
.meter.good > i { background: var(--good); } .meter.bad > i { background: var(--bad); } .meter.warn > i { background: var(--warn); } .meter.info > i { background: var(--info); } .meter.gold > i { background: var(--gold); }
.stat .sub { font-size: .72rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day { display: flex; align-items: center; gap: 12px; }
.day-n { font-family: var(--f-display); font-weight: 800; font-size: 1rem; white-space: nowrap; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: 190px minmax(0, 1fr) 290px; gap: 20px; padding: 20px 16px 48px; max-width: 1480px; margin: 0 auto; align-items: start; }
.nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h, 70px) + 16px); display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.badge { font-family: var(--f-mono); font-size: .68rem; background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 1px 7px; font-weight: 600; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.side { min-width: 0; display: flex; flex-direction: column; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h, 70px) + 16px); max-height: calc(100vh - var(--hud-h, 70px) - 32px); overflow: auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: transparent; border-style: dashed; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.page-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.page-head h2 { font-size: 1.6rem; font-weight: 800; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.grid.kpi { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: .88rem; transition: transform .08s ease, background .15s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.sm { padding: 5px 10px; font-size: .8rem; border-radius: 8px; }
.btn.big { padding: 12px 22px; font-size: 1rem; font-family: var(--f-display); font-weight: 700; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: .85rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .cost { font-family: var(--f-mono); font-size: .72rem; opacity: .7; font-weight: 400; }
.chip[disabled] { opacity: .4; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 6px; }
.input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; }
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { resize: vertical; min-height: 64px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.info { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- Avatars ---------- */
.av { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-family: var(--f-display); font-weight: 700; font-size: .78rem; flex: none; letter-spacing: 0; }
.av.lg { width: 44px; height: 44px; font-size: .9rem; }
.av.xl { width: 64px; height: 64px; font-size: 1.2rem; }
.av.sm { width: 26px; height: 26px; font-size: .62rem; }
.check { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--info); color: #fff; flex: none; }
.check svg { width: 10px; height: 10px; }
.check.paid { background: var(--gold); }

/* ---------- Studio ---------- */
.plats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.plat { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.plat:hover { border-color: var(--muted); }
.plat[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.plat .pn { font-weight: 700; display: flex; gap: 6px; align-items: center; }
.plat .pf { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; }
.plat.locked { background: var(--surface-2); cursor: default; }
.opt-group { display: flex; flex-direction: column; gap: 8px; }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; }
.forecast { background: var(--surface-2); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; align-self: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h, 70px) + 16px); }
.fc-row { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.fc-row b { font-family: var(--f-mono); font-weight: 600; }
.phone-preview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.phone-preview .ph-media { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; color: #fff; text-align: center; padding: 12px; font-size: .9rem; line-height: 1.2; }

/* ---------- Posts ---------- */
.post { display: flex; flex-direction: column; gap: 10px; }
.post-head { display: flex; gap: 10px; align-items: center; }
.post-head .who { min-width: 0; flex: 1; }
.post-head .who b { display: flex; align-items: center; gap: 4px; }
.post-body { font-size: 1rem; overflow-wrap: anywhere; }
.post-metrics { display: flex; gap: 16px; flex-wrap: wrap; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.post-metrics b { color: var(--ink); font-weight: 600; }
.post.viral { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.comments { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.cm { display: flex; gap: 8px; font-size: .86rem; }
.cm b { font-weight: 700; }
.cm.celeb { background: var(--accent-soft); border-radius: 8px; padding: 6px 8px; }

.result { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner-viral { background: var(--gold-soft); color: var(--gold); border-radius: 10px; padding: 10px 12px; font-family: var(--f-display); font-weight: 800; letter-spacing: .02em; }
.banner-flop { background: var(--surface-2); color: var(--muted); border-radius: 10px; padding: 10px 12px; font-weight: 700; }

/* ---------- People ---------- */
.person { display: flex; flex-direction: column; gap: 10px; }
.person .top { display: flex; gap: 12px; align-items: center; }
.person .top > div { min-width: 0; }
.rel { display: flex; align-items: center; gap: 8px; }
.rel .meter { flex: 1; margin: 0; position: relative; }
.rel-bar { height: 6px; background: var(--surface-2); border-radius: 99px; position: relative; flex: 1; }
.rel-bar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.rel-bar::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5; }
.lb { width: 100%; border-collapse: collapse; font-size: .88rem; }
.lb td, .lb th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.lb th { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.lb td.n { text-align: right; font-family: var(--f-mono); }
.lb tr.you td { background: var(--accent-soft); font-weight: 700; }
.table-wrap { overflow-x: auto; }

/* ---------- Inbox ---------- */
.msg { display: flex; flex-direction: column; gap: 8px; }
.msg.unread { border-left: 3px solid var(--accent); }
.msg .from { display: flex; gap: 10px; align-items: center; }
.msg .from > div { min-width: 0; flex: 1; }

/* ---------- Side ---------- */
.trend { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.trend:last-child { border-bottom: 0; }
.trend b { font-size: .88rem; overflow-wrap: anywhere; }
.flames { font-family: var(--f-mono); font-size: .72rem; color: var(--accent); white-space: nowrap; }
.log { display: flex; flex-direction: column; gap: 6px; font-size: .82rem; }
.log .li { display: grid; grid-template-columns: 34px 1fr; gap: 6px; }
.log .li .t { font-family: var(--f-mono); color: var(--muted); font-size: .7rem; padding-top: 2px; }
.log .li.good .m { color: var(--good); } .log .li.bad .m { color: var(--bad); } .log .li.gold .m { color: var(--gold); font-weight: 700; }

/* ---------- Modal ---------- */
.modal-wrap { position: fixed; inset: 0; background: rgba(15, 5, 12, .55); z-index: 50; display: grid; place-items: center; padding: 16px; backdrop-filter: blur(3px); }
.modal { background: var(--surface); color: var(--ink); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: pop .22s ease; }
.modal .eyebrow { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.modal h3 { font-size: 1.35rem; font-weight: 800; }
.modal .body { color: var(--ink); font-size: .98rem; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.choice:hover { border-color: var(--ink); background: var(--surface-2); }
.choice b { font-weight: 700; }
.choice span { font-size: .8rem; color: var(--muted); }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.fx { display: flex; gap: 6px; flex-wrap: wrap; }
.summary-lines { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
.summary-lines div { display: flex; justify-content: space-between; gap: 10px; }
.summary-lines .num { white-space: nowrap; }
@keyframes pop { from { transform: translateY(8px) scale(.98); opacity: .6; } to { transform: none; opacity: 1; } }

/* ---------- Toasts ---------- */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: .88rem; box-shadow: var(--shadow); max-width: min(360px, calc(100vw - 32px)); animation: pop .2s ease; }
.toast.gold { background: var(--gold); color: #1a1200; }
.toast.bad { background: var(--bad); color: #fff; }

/* ---------- Start screen ---------- */
.start { max-width: 1120px; margin: 0 auto; padding: 36px 16px 60px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; align-items: start; }
.logo { font-family: var(--f-display); font-weight: 800; font-size: clamp(2.6rem, 7vw, 4.8rem); line-height: .92; letter-spacing: -0.03em; }
.logo em { font-style: normal; color: var(--accent); }
.tagline { font-size: 1.1rem; color: var(--muted); max-width: 46ch; margin-top: 14px; }
.ticker { overflow: hidden; white-space: nowrap; border-block: 1px solid var(--line); padding: 8px 0; margin-top: 22px; font-family: var(--f-mono); font-size: .78rem; color: var(--muted); }
.ticker span { display: inline-block; animation: tick 60s linear infinite; }
@keyframes tick { to { transform: translateX(-50%); } }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }

/* ---------- Charts ---------- */
.chart-box { position: relative; width: 100%; height: 260px; }
.chart-box canvas { width: 100%; height: 100%; display: block; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 90px minmax(0, 1fr) 70px; gap: 10px; align-items: center; font-size: .85rem; }
.bar-row .track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: inherit; }
.bar-row .n { text-align: right; font-family: var(--f-mono); font-size: .8rem; }

.ach { display: flex; gap: 10px; align-items: flex-start; }
.ach .medal { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-family: var(--f-display); font-weight: 800; font-size: .8rem; flex: none; }
.ach.on .medal { background: var(--gold-soft); color: var(--gold); }
.ach.off { opacity: .55; }
.ladder { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.rung { background: var(--surface-2); border-radius: 8px; padding: 8px; font-size: .74rem; min-width: 0; }
.rung b { display: block; font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rung.on { background: var(--ink); color: var(--bg); }
.rung.on .muted { color: inherit; opacity: .7; }

.news { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.news:last-child { border-bottom: 0; }
.news .nd { font-family: var(--f-mono); font-size: .72rem; color: var(--muted); width: 48px; flex: none; padding-top: 3px; }
.news .nh { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.25; }
.news.you .nh { color: var(--accent); }

.hint { font-size: .82rem; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }

/* ---------- Responsive ---------- */
@media (max-width: 1240px) {
  .shell { grid-template-columns: 170px minmax(0, 1fr); }
  .side { grid-column: 2; position: static; max-height: none; overflow: visible; }
  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .hud { grid-template-columns: 1fr auto; }
  .hud .stats { grid-column: 1 / -1; grid-row: 2; }
  .composer { grid-template-columns: minmax(0, 1fr); }
  .forecast { position: static; }
  .plats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .start { grid-template-columns: minmax(0, 1fr); }
  .ladder { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
