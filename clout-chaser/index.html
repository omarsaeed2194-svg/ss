<meta charset="utf-8">
<title>Clout Chaser</title>
<meta name="description" content="A social media life sim: grow from zero to icon across five platforms, deal with celebrities, brands, scandals and burnout.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&display=swap">
<style>
/* Layout: a social app. Desktop = icon sidebar | 600px timeline column | trends rail. Phone = app bar, timeline, bottom tab bar, floating compose button. */
:root {
  --bg: #000000;
  --surface: #16181C;
  --surface-2: #202327;
  --hover: rgba(231, 233, 234, .04);
  --ink: #E7E9EA;
  --muted: #71767B;
  --line: #2F3336;
  --accent: #1D9BF0;
  --accent-soft: rgba(29, 155, 240, .14);
  --like: #F91880;
  --repost: #00BA7C;
  --gold: #FFD400;
  --good: #00BA7C;
  --bad: #F4212E;
  --warn: #FFAD1F;
  --btn: #EFF3F4;
  --btn-ink: #0F1419;
  --scrim: rgba(91, 112, 131, .4);
  --f-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-display: 'Unbounded', 'Arial Black', var(--f-body);
  --f-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #FFFFFF; --surface: #F7F9F9; --surface-2: #EFF3F4; --hover: rgba(15, 20, 25, .03); --ink: #0F1419; --muted: #536471; --line: #E1E8ED;
    --accent-soft: rgba(29, 155, 240, .1); --gold: #D4A600; --btn: #0F1419; --btn-ink: #FFFFFF; --scrim: rgba(0, 0, 0, .4);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #FFFFFF; --surface: #F7F9F9; --surface-2: #EFF3F4; --hover: rgba(15, 20, 25, .03); --ink: #0F1419; --muted: #536471; --line: #E1E8ED;
  --accent-soft: rgba(29, 155, 240, .1); --gold: #D4A600; --btn: #0F1419; --btn-ink: #FFFFFF; --scrim: rgba(0, 0, 0, .4);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.35; margin: 0; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; text-wrap: balance; }
p { margin: 0; }
svg { flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .gold { color: var(--gold); } .blue { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; }
.ico-lg { width: 26px; height: 26px; }

/* ---------- App frame ---------- */
.layout { display: grid; grid-template-columns: 260px 600px 350px; justify-content: center; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; overflow-y: auto; scrollbar-width: none; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; padding: 10px 12px 12px; }
.brand em { font-style: normal; color: var(--like); }
.nav-item { display: flex; align-items: center; gap: 16px; padding: 11px 12px; border-radius: 99px; border: 0; background: none; font-size: 19px; text-align: left; width: fit-content; position: relative; }
.nav-item:hover { background: var(--hover); }
.nav-item[aria-current="page"] { font-weight: 800; }
.nav-item .dotbadge { position: absolute; top: 6px; left: 26px; min-width: 18px; height: 18px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.nav-sub { font-size: 15px; padding: 8px 12px; color: var(--muted); gap: 14px; }
.nav-sub[aria-current="page"] { color: var(--ink); }
.nav-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.post-btn { background: var(--btn); color: var(--btn-ink); border: 0; border-radius: 99px; font-weight: 800; font-size: 17px; padding: 14px; margin: 12px 0 8px; width: 100%; }
.me-chip { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 99px; border: 0; background: none; text-align: left; }
.me-chip:hover { background: var(--hover); }

.col { border-inline: 1px solid var(--line); min-width: 0; min-height: 100vh; padding-bottom: 80px; }
.col-head { position: sticky; top: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.col-title { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 53px; }
.col-title h2 { font-size: 20px; }
.col-title .sub { font-size: 13px; color: var(--muted); }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--hover); }
.tabs { display: flex; }
.tabs button { flex: 1; background: none; border: 0; padding: 15px 8px 0; color: var(--muted); font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.tabs button:hover { background: var(--hover); }
.tabs button span.bar { height: 4px; width: 56px; border-radius: 99px; background: transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.tabs button[aria-selected="true"] span.bar { background: var(--accent); }

.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 8px 0 24px 28px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.rail > * { flex: none; }
.rail .statgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.panel { background: var(--surface); border-radius: 16px; overflow: hidden; }
.panel.bordered { background: none; border: 1px solid var(--line); }
.panel h3 { font-size: 20px; padding: 12px 16px; }
.panel-row { display: block; width: 100%; text-align: left; padding: 12px 16px; background: none; border: 0; }
.panel-row:hover { background: var(--hover); }
.panel-foot { padding: 14px 16px; color: var(--accent); font-size: 15px; background: none; border: 0; text-align: left; width: 100%; }
.panel-foot:hover { background: var(--hover); }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 99px; padding: 10px 16px; color: var(--muted); border: 1px solid transparent; }
.search:focus-within { border-color: var(--accent); background: var(--bg); color: var(--accent); }
.search input { border: 0; background: none; outline: none; flex: 1; color: var(--ink); min-width: 0; }

.topbar { display: none; }
.tabbar { display: none; }
.fab { display: none; }

/* ---------- Status meters (Aura-style stats) ---------- */
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); }
.statcell { background: var(--surface); padding: 10px 14px; min-width: 0; }
.statcell .k { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.statcell .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.meter > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .6s ease; }
.meter.good > i { background: var(--good); } .meter.bad > i { background: var(--bad); } .meter.warn > i { background: var(--warn); } .meter.gold > i { background: var(--gold); } .meter.like > i { background: var(--like); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.strip .sp { flex: none; display: flex; align-items: center; gap: 6px; background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; border: 0; }
.strip .sp .l { color: var(--muted); font-weight: 500; }

/* ---------- Timeline posts ---------- */
.tw { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
.tw:hover { background: var(--hover); }
.tw.fresh { animation: slidein 1.2s ease; }
.tw-ctx { grid-column: 2; font-size: 13px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 6px; margin-bottom: -6px; }
.tw-ctx.gold { color: var(--gold); }
.tw-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tw-head { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 15px; }
.tw-head b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.tw-head .h { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tw-head .pl { margin-left: auto; flex: none; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.tw-text { font-size: 15px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.tw-text .tag, .tw-text .at { color: var(--accent); }
.tw-media { margin-top: 8px; border-radius: 16px; border: 1px solid var(--line); aspect-ratio: 16 / 9; max-width: 100%; max-height: 260px; display: grid; place-items: center; position: relative; overflow: hidden; color: #fff; }
.tw-media .lbl { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-align: center; padding: 16px; text-shadow: 0 2px 12px rgba(0,0,0,.3); line-height: 1.15; }
.tw-media .play { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; }
.tw-media .dur { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.6); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-weight: 700; }
.tw-actions { display: flex; justify-content: space-between; max-width: 425px; margin-top: 8px; margin-left: -8px; }
.act { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--muted); font-size: 13px; padding: 0; font-variant-numeric: tabular-nums; }
.act .ib { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background .15s, color .15s; }
.act .ico { width: 18px; height: 18px; }
.act:hover { color: var(--accent); } .act:hover .ib { background: var(--accent-soft); }
.act.rp:hover, .act.rp.on { color: var(--repost); } .act.rp:hover .ib { background: rgba(0, 186, 124, .12); }
.act.lk:hover, .act.lk.on { color: var(--like); } .act.lk:hover .ib { background: rgba(249, 24, 128, .12); }
.act.on .ico { fill: currentColor; }
.act[disabled] { opacity: .5; cursor: default; }
.pop { animation: pop .35s ease; }
.badge-v { display: inline-grid; place-items: center; width: 17px; height: 17px; flex: none; color: var(--accent); }
.badge-v.gold { color: var(--gold); }
.badge-v svg { width: 17px; height: 17px; }

.av { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 800; font-size: 14px; flex: none; letter-spacing: 0; }
.av.sm { width: 32px; height: 32px; font-size: 12px; }
.av.xs { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 48px; height: 48px; font-size: 16px; }
.av.xl { width: 134px; height: 134px; font-size: 42px; border: 4px solid var(--bg); }

/* thread */
.thread-main { padding: 12px 16px 0; border-bottom: 1px solid var(--line); }
.thread-main .tw-text { font-size: 17px; margin-top: 12px; }
.thread-meta { color: var(--muted); font-size: 15px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.thread-counts { display: flex; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.thread-counts b { color: var(--ink); }
.reply-box { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.reply-box textarea { width: 100%; border: 0; background: none; resize: none; font-size: 17px; padding: 8px 0; outline: none; min-height: 44px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }

/* ---------- Buttons & chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 99px; border: 1px solid var(--line); background: none; padding: 0 16px; min-height: 34px; font-weight: 700; font-size: 14px; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { filter: brightness(.92); background: var(--btn); }
.btn.blue { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.big { min-height: 44px; font-size: 16px; padding: 0 24px; }
.btn.sm { min-height: 30px; font-size: 13px; padding: 0 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 6px 12px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip[disabled] { opacity: .4; cursor: not-allowed; }
.chip .cost { font-size: 12px; opacity: .7; font-weight: 500; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
/* horizontal rows: fade the edge that has more content, scroll with the mouse wheel or by dragging */
.scroller.more-r, .strip.more-r { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 36px), transparent); }
.scroller.more-l, .strip.more-l { -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px); mask-image: linear-gradient(90deg, transparent, #000 36px); }
.scroller.more-l.more-r, .strip.more-l.more-r { -webkit-mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(90deg, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
@media (pointer: fine) { .scroller.more-l, .scroller.more-r, .strip.more-l, .strip.more-r { cursor: grab; } .dragging, .dragging * { cursor: grabbing !important; user-select: none; } }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.gold { color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, transparent); }
.pill.blue { color: var(--accent); background: var(--accent-soft); }
.pill.like { color: var(--like); background: color-mix(in srgb, var(--like) 14%, transparent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.input { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 12px; width: 100%; outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.label { font-size: 13px; color: var(--muted); }

/* ---------- Generic sections (career screens) ---------- */
.sect { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.sect h3 { font-size: 17px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.owned { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.card .t { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.empty { padding: 40px 32px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty h3 { color: var(--ink); font-size: 24px; }
.list-row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-inline: 0; border-top: 0; width: 100%; text-align: left; }
.list-row:hover { background: var(--hover); }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .grow > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
table.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
.lb td, .lb th { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.lb th { color: var(--muted); font-weight: 500; font-size: 13px; }
.lb td.n { text-align: right; font-variant-numeric: tabular-nums; }
.lb tr.you td { background: var(--accent-soft); font-weight: 700; }
.table-wrap { overflow-x: auto; }

/* ---------- Notifications ---------- */
.nt { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.nt:hover { background: var(--hover); }
.nt.unread { background: var(--accent-soft); }
.nt .ni { display: flex; justify-content: flex-end; padding-top: 2px; }
.nt .ni .ico { width: 28px; height: 28px; }
.nt .quote { color: var(--muted); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }

/* ---------- Messages ---------- */
.chat { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-height: 50vh; }
.bub { max-width: 78%; padding: 10px 14px; border-radius: 22px; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.bub.them { background: var(--surface-2); align-self: flex-start; border-bottom-left-radius: 6px; }
.bub.me { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.bub-meta { font-size: 12px; color: var(--muted); margin: 2px 6px 10px; }
.bub-meta.me { align-self: flex-end; }
.bub-acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
.offer { border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; max-width: 86%; align-self: flex-start; background: var(--bg); }
.dm-bar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.dm-bar input { flex: 1; background: var(--surface-2); border: 0; border-radius: 99px; padding: 10px 16px; outline: none; min-width: 0; }
.typing { align-self: flex-start; background: var(--surface-2); border-radius: 22px; padding: 12px 16px; display: flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }

/* ---------- Profile ---------- */
.banner { height: 200px; max-width: 100%; }
.prof { padding: 12px 16px 0; position: relative; }
.prof .av.xl { margin-top: -80px; }
.prof-actions { position: absolute; right: 16px; top: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.prof h2 { font-size: 20px; display: flex; align-items: center; gap: 4px; margin-top: 8px; }
.prof .handle { color: var(--muted); }
.prof .bio { margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.prof .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-top: 12px; }
.prof .counts { display: flex; gap: 20px; margin: 12px 0; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.prof .counts b { color: var(--ink); }
.relbar { height: 6px; background: var(--surface-2); border-radius: 99px; position: relative; overflow: hidden; }
.relbar i { position: absolute; top: 0; bottom: 0; }
.relbar::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--bg); }

/* ---------- Trends ---------- */
.trend-row { display: flex; justify-content: space-between; gap: 8px; }
.trend-row .ctx { font-size: 13px; color: var(--muted); }
.trend-row b { display: block; font-size: 15px; margin: 2px 0; }
.trend-row .pill { align-self: flex-start; flex: none; }

/* ---------- Compose sheet ---------- */
.sheet-wrap, .modal-wrap, .drawer-wrap { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 5vh 16px; overflow-y: auto; }
.sheet { background: var(--bg); border-radius: 16px; width: min(600px, 100%); display: flex; flex-direction: column; animation: rise .22s ease; }
@media (min-width: 701px) { .sheet { max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; position: sticky; top: 0; background: var(--bg); border-radius: 16px 16px 0 0; z-index: 2; }
.compose-body { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 4px 16px 12px; }
