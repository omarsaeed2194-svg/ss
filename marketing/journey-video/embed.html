<!-- Saudisoft Localization Journey: drop-in responsive embed.
     Upload the files in dist/ to your site (e.g. /media/) and adjust MEDIA below.
     Phones in portrait get the vertical 9:16 cut; everything else gets the horizontal 16:9 cut. -->
<div class="ss-journey">
  <video autoplay muted loop playsinline preload="metadata"
         aria-label="Saudisoft Localization: from Jeddah in 1983 to 100+ languages, our localization journey"></video>
</div>
<style>
  .ss-journey { position: relative; width: 100%; max-width: 1280px; margin: 0 auto; aspect-ratio: 16 / 9;
                border-radius: 16px; overflow: hidden; background: #f3f6f2; }
  .ss-journey video { width: 100%; height: 100%; display: block; object-fit: cover; }
  @media (max-width: 767px) and (orientation: portrait) {
    .ss-journey { max-width: 480px; aspect-ratio: 9 / 16; }
  }
</style>
<script>
  (function () {
    var MEDIA = "/media/saudisoft-localization-journey-";
    var v = document.querySelector(".ss-journey video");
    var cut = matchMedia("(max-width: 767px) and (orientation: portrait)").matches ? "vertical" : "horizontal";
    v.poster = MEDIA + cut + "-poster.jpg";
    v.innerHTML =
      '<source src="' + MEDIA + cut + '-1080p.webm" type="video/webm">' +
      '<source src="' + MEDIA + cut + '-1080p.mp4" type="video/mp4">';
    v.load();
  })();
</script>
